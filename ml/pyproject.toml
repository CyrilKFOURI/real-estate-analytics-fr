[project]
name = "rea-ml"
version = "0.1.0"
description = "Price check model for French residential sales (DVF): one LightGBM model, out-of-time validated"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1", "lightgbm>=4.5", "numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.5"]

[project.scripts]
rea-ml = "rea_ml.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rea_ml"]
