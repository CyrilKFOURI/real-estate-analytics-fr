[project]
name = "rea-pipeline"
version = "0.1.0"
description = "Offline pipeline: French open real-estate data -> precomputed KPIs"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1", "polars>=1.0", "httpx>=0.27"]

[project.scripts]
rea = "rea_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rea_pipeline"]
